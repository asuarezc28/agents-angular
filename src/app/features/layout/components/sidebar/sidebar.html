<aside
  class="sidebar-frame rounded-xl border p-1.5"
  [attr.aria-label]="'layoutBase.sidebar.ariaLabel' | translate"
>
  <div class="sidebar-content">
    @for (panel of panels(); track panel.id) {
      <button
        pButton
        type="button"
        [text]="true"
        [rounded]="true"
        [class]="buttonClass(panel.id)"
        (click)="selectPanel(panel)"
        [attr.aria-label]="panel.titleKey | translate"
        class="flex items-center justify-center"
      >
        <app-tooltip-icon
          [icon]="iconFor(panel.icon)"
          [size]="24"
          [tooltip]="panel.titleKey | translate"
          [ariaLabel]="panel.titleKey | translate"
        />
      </button>
    }
  </div>
</aside>
