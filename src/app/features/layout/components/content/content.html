<p-card>
  @if (panel(); as activePanel) {
    <ng-template pTemplate="header">
      <div class="p-4">
        <h2 class="text-xl font-semibold">{{ activePanel.titleKey | translate }}</h2>
      </div>
    </ng-template>

    <p class="opacity-80">
      {{ activePanel.descriptionKey | translate }}
    </p>
  } @else {
    <p class="opacity-80">{{ 'messages.noData' | translate }}</p>
  }
</p-card>
