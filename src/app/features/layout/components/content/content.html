@if (panel(); as activePanel) {
  @if (activePanel.component; as activePanelComponent) {
    <ng-container [ngComponentOutlet]="activePanelComponent" />
  } @else {
    <p class="opacity-80">{{ activePanel.descriptionKey | translate }}</p>
  }
} @else {
  <p class="opacity-80">{{ 'messages.noData' | translate }}</p>
}
